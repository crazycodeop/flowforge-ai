[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[project]
name = "flowforge-backend"
version = "0.1.0"
description = "FlowForge AI - Resilient Workflow Orchestration Engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy>=2.0.28",
    "alembic>=1.13.1",
    "psycopg2-binary>=2.9.9",
    "asyncpg>=0.29.0",
    "celery>=5.3.6",
    "redis>=5.0.2",
    "python-dotenv>=1.0.1",
    "httpx>=0.27.0",
    "jsonschema>=4.20.0",
    "pyjwt>=2.8.0",
    "email-validator>=2.1.0",
    "python-multipart>=0.0.9",
    "pypdf>=4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.3.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = [
    "B008",  # do not perform function calls in argument defaults (needed for FastAPI Depends)
    "E501",  # line length handled by ruff format
]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*" = ["E501", "W291"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
