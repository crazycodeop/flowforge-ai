databases:
  - name: flowforge-db
    databaseName: flowforge
    user: flowforge
    plan: free

services:
  # 1. Managed Redis
  - type: redis
    name: flowforge-redis
    plan: free
    ipAllowList: []

  # 2. FlowForge AI Unified Backend (FastAPI + Background Celery Worker)
  - type: web
    name: flowforge-api
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -e "./backend[dev]"
    startCommand: cd backend && python start.py
    healthCheckPath: /api/v1/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: false
      - key: PROJECT_NAME
        value: FlowForge AI
      - key: API_V1_STR
        value: /api/v1
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: flowforge-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: flowforge-redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: flowforge-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: redis
          name: flowforge-redis
          property: connectionString
      - key: RUN_WORKER
        value: "true"
      - key: AI_PROVIDER
        value: groq
      - key: AI_MODEL
        value: llama-3.3-70b-versatile
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false

  # 3. FlowForge AI Frontend (Studio & Client Portal Static SPA)
  - type: web
    name: flowforge-frontend
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: flowforge-api
          property: host
